<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Atlas de Thay</title>
  <link rel="stylesheet" href="atlas.css">
</head>
<body>
  <a class="skip-link" href="#landmark-list">Aller à la liste des lieux</a>

  <!-- Surface principale : la carte occupe tout le viewport -->
  <div id="map-stage" class="map-stage" tabindex="0" data-zoom="1.00"
       role="application" aria-roledescription="carte"
       aria-label="Carte de Thay. Glisser pour déplacer, molette ou pincement pour zoomer, flèches et touches plus ou moins au clavier."
       aria-describedby="map-help">
    <div id="map-world" class="map-world">
      <img id="map-image" class="map-image" src="assets/thay-joueurs.jpg" width="3186" height="4096"
           alt="Carte géographique de Thay : plateau central, lacs, provinces et côte méridionale." draggable="false">
      <div id="map-markers" class="map-markers"></div>
    </div>
  </div>
  <p id="map-help" class="visually-hidden">Activez un repère pour ouvrir sa fiche.</p>

  <div class="map-tools" role="group" aria-label="Contrôles de la carte">
    <button id="zoom-in" type="button" class="tool" aria-label="Zoom avant" title="Zoom avant"><span aria-hidden="true">+</span></button>
    <button id="zoom-out" type="button" class="tool" aria-label="Zoom arrière" title="Zoom arrière"><span aria-hidden="true">−</span></button>
    <button id="reset-view" type="button" class="tool tool--wide" title="Revenir à la vue d’ensemble">Vue d’ensemble</button>
  </div>

  <p id="feedback" class="feedback visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>

  <!-- Barre latérale : guide, recherche, liste -->
  <section id="sidebar" class="sidebar" aria-labelledby="atlas-title">
    <div class="sidebar-head">
      <h1 id="atlas-title" class="atlas-title">Atlas de Thay</h1>
      <button id="list-toggle" type="button" class="list-toggle" aria-expanded="true" aria-controls="sidebar-panel">
        <span class="list-toggle-label">Lieux</span><span class="chevron" aria-hidden="true"></span>
      </button>
    </div>

    <div class="atlas-search" role="search" aria-label="Trouver une fiche dans l’atlas">
        <label class="field-label" for="search">Trouver une fiche</label>
        <div class="search-row">
          <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Lieu, quartier, établissement…" aria-controls="landmark-list" enterkeyhint="search">
          <button id="clear-search" type="button" class="btn-quiet" hidden>Effacer</button>
        </div>
    </div>
    <div id="sidebar-panel" class="sidebar-panel">
      <button id="country-guide" type="button" class="country-guide" aria-label="Lire le Guide de Thay" aria-describedby="country-guide-description">
        <svg class="guide-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true" focusable="false"><path d="M12 5v15M12 5C8 2 4 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-2-1-6-2-10 1Z"/><path d="M5 7c2-.4 3-.2 4 .5M15 7.5c1-.7 2-.9 4-.5"/></svg>
        <span class="guide-link-copy"><span class="guide-link-title">Guide de Thay</span><span id="country-guide-description" class="guide-link-description">Territoire, société et lois</span></span>
        <span class="guide-link-arrow" aria-hidden="true">›</span>
      </button>
      <div class="finder">
        <label class="field-label" for="category">Catégorie</label>
        <select id="category">
          <option value="tous">Tous les lieux</option>
          <option value="province">Provinces</option>
          <option value="ville">Villes</option>
          <option value="nature">Sites naturels</option>
          <option value="route">Routes</option>
          <option value="patrimoine">Patrimoine</option>
        </select>
        <p id="result-count" class="result-count"></p>
      </div>

      <ul id="landmark-list" class="landmark-list" aria-label="Lieux de l’atlas"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <p>Aucun lieu ne correspond à cette recherche.</p>

      </div>


      <section class="legend" aria-labelledby="legend-title">
        <h2 id="legend-title">Légende</h2>
        <ul class="legend-list">
          <li><span class="glyph" data-kind="province" aria-hidden="true"></span>Provinces</li>
          <li><span class="glyph" data-kind="ville" aria-hidden="true"></span>Villes</li>
          <li><span class="glyph" data-kind="nature" aria-hidden="true"></span>Site naturel</li>
          <li><span class="glyph" data-kind="route" aria-hidden="true"></span>Routes</li>
          <li><span class="glyph" data-kind="patrimoine" aria-hidden="true"></span>Patrimoine</li>
        </ul>

      </section>
    </div>
  </section>

  <!-- Fiche de lieu : papier clair Homebrewery -->
  <aside id="detail-panel" class="detail" aria-labelledby="detail-title" data-selected="" hidden>
    <header class="detail-head">
      <div>
        <p id="detail-kind" class="detail-kind"></p>
        <h2 id="detail-title" class="detail-title" tabindex="-1"></h2>
      </div>
      <div class="detail-controls">
        <button id="detail-expand" type="button" class="detail-close" aria-expanded="false" aria-controls="detail-panel">Agrandir</button>
        <button id="detail-close" type="button" class="detail-close" aria-keyshortcuts="Escape"><span aria-hidden="true">×</span> Fermer</button>
      </div>
    </header>
    <nav id="detail-navigation" class="detail-navigation" aria-label="Sommaire de la fiche" hidden>
      <label for="detail-section">Dans cette fiche</label>
      <select id="detail-section"><option value="">Sommaire</option></select>
    </nav>
    <div class="detail-content">
      <figure id="detail-media" class="detail-media"></figure>
      <article id="detail-body" class="hb-page"></article>
    </div>
    <div class="detail-actions">
      <button id="detail-locate" type="button" class="btn">Centrer la carte sur ce lieu</button>
    </div>
  </aside>

  <noscript><p class="noscript">L’atlas interactif nécessite JavaScript. La carte reste visible ci-dessus.</p></noscript>

  <script src="atlas-data.js"></script>
  <script src="atlas.js"></script>
</body>
</html>
